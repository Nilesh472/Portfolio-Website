<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Projects | Nilesh Yadav</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="projects">
    <div class="noise"></div>
    <div class="gradient-orbit gradient-orbit-a"></div>
    <div class="gradient-orbit gradient-orbit-b"></div>
    <canvas id="particle-canvas" aria-hidden="true"></canvas>
    <div class="scroll-progress" id="scroll-progress"></div>
    <div class="cursor-glow" id="cursor-glow"></div>
    <header class="site-header" data-shell="header"></header>
    <main>
      <section class="page-hero">
        <div class="container page-grid two-up">
          <div class="content-stack" data-reveal>
            <p class="section-kicker">Projects</p>
            <h1 class="display-title">Project work spanning AI concepts, analytics outputs, and product-style builds.</h1>
            <p class="section-copy">
              These projects show how I think through use cases, build technical solutions, and present them with clarity.
            </p>
          </div>
          <div class="media-card glass glass-strong" data-reveal data-tilt>
            <img src="./assets/visuals/data-wave.svg" alt="Data systems illustration" />
          </div>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <div id="featured-project" class="featured-project glass glass-strong spotlight-card" data-reveal></div>
          <div class="filter-row" id="project-filters" data-reveal></div>
          <div class="project-grid" id="project-grid"></div>
        </div>
      </section>
      <section class="section compact-section">
        <div class="container" data-reveal>
          <div class="section-heading">
            <p class="section-kicker">Recommendations</p>
            <h2>Future social proof can sit alongside project depth for stronger trust.</h2>
          </div>
          <div class="testimonial-grid" id="testimonial-grid"></div>
        </div>
      </section>
    </main>
    <footer class="site-footer" data-shell="footer"></footer>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./data.js"></script>
    <script src="./script.js"></script>
  </body>
</html>

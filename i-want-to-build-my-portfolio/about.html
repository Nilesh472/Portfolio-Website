<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>About | Nilesh Yadav</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="about">
    <div class="noise"></div>
    <div class="gradient-orbit gradient-orbit-a"></div>
    <div class="gradient-orbit gradient-orbit-b"></div>
    <canvas id="particle-canvas" aria-hidden="true"></canvas>
    <div class="scroll-progress" id="scroll-progress"></div>
    <div class="cursor-glow" id="cursor-glow"></div>
    <header class="site-header" data-shell="header"></header>
    <main>
      <section class="page-hero">
        <div class="container page-grid two-up">
          <div class="content-stack" data-reveal>
            <p class="section-kicker">About me</p>
            <h1 class="display-title">A professional portfolio built around growth, clarity, and useful execution.</h1>
            <p class="section-copy" id="about-story"></p>
            <p class="section-copy" id="about-mission"></p>
          </div>
          <div class="portrait-panel glass glass-strong" data-reveal data-tilt>
            <img src="./assets/nilesh-photo.jpeg" alt="Nilesh Yadav portrait" class="page-portrait" />
          </div>
        </div>
      </section>
      <section class="section">
        <div class="container page-grid two-up">
          <div id="about-points"></div>
          <div class="glass values-card" data-reveal>
            <span class="mono-label">Why people connect with me</span>
            <div id="career-values"></div>
          </div>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <div class="section-heading" data-reveal>
            <p class="section-kicker">Journey</p>
            <h2>How the story is evolving across code, analytics, and AI.</h2>
          </div>
          <div class="journey-grid" id="journey-cards"></div>
        </div>
      </section>
    </main>
    <footer class="site-footer" data-shell="footer"></footer>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./data.js"></script>
    <script src="./script.js"></script>
  </body>
</html>

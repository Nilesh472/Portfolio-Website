<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skills | Nilesh Yadav</title>
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Manrope:wght@400;500;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body data-page="skills">
    <div class="noise"></div>
    <div class="gradient-orbit gradient-orbit-a"></div>
    <div class="gradient-orbit gradient-orbit-b"></div>
    <canvas id="particle-canvas" aria-hidden="true"></canvas>
    <div class="scroll-progress" id="scroll-progress"></div>
    <div class="cursor-glow" id="cursor-glow"></div>
    <header class="site-header" data-shell="header"></header>
    <main>
      <section class="page-hero">
        <div class="container page-grid two-up">
          <div class="content-stack" data-reveal>
            <p class="section-kicker">Skills and stack</p>
            <h1 class="display-title">Technical capabilities shaped for analytics, automation, and modern delivery.</h1>
            <p class="section-copy">
              This is the toolkit behind both my professional growth and the client work I want to do more of.
            </p>
          </div>
          <div class="media-card glass glass-strong" data-reveal data-tilt>
            <img src="./assets/visuals/ai-core.svg" alt="AI core stack illustration" />
          </div>
        </div>
      </section>
      <section class="section">
        <div class="container">
          <div class="skills-page-grid" id="skills-grid"></div>
        </div>
      </section>
      <section class="section compact-section">
        <div class="container">
          <div class="section-heading" data-reveal>
            <p class="section-kicker">Tech logos</p>
            <h2>A quick visual map of the stack I work with most often.</h2>
          </div>
          <div class="logo-cloud" id="logo-cloud"></div>
        </div>
      </section>
    </main>
    <footer class="site-footer" data-shell="footer"></footer>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="./data.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
